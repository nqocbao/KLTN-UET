version: "3.1"

rules:
  # === Basic conversation rules ===
  
  - rule: Say hello when user greets
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye when user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Answer bot challenge
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Thank the user
    steps:
      - intent: thank_you
      - action: utter_thank_you

  - rule: Help user
    steps:
      - intent: help
      - action: utter_help

  - rule: Affirm
    steps:
      - intent: affirm
      - action: utter_affirm

  - rule: Deny
    steps:
      - intent: deny
      - action: utter_deny

  # === Form rules - Multi-turn slot filling ===

  - rule: Activate flight form
    steps:
      - intent: search_flight
      - action: flight_form
      - active_loop: flight_form

  - rule: Submit flight form
    condition:
      - active_loop: flight_form
    steps:
      - action: flight_form
      - active_loop: null
      - action: action_search_flights

  - rule: Activate hotel form
    steps:
      - intent: search_hotel
      - action: hotel_form
      - active_loop: hotel_form

  - rule: Submit hotel form
    condition:
      - active_loop: hotel_form
    steps:
      - action: hotel_form
      - active_loop: null
      - action: action_search_hotels

  - rule: Activate tour form
    steps:
      - intent: search_tour
      - action: tour_form
      - active_loop: tour_form

  - rule: Submit tour form
    condition:
      - active_loop: tour_form
    steps:
      - action: tour_form
      - active_loop: null
      - action: action_search_tours

  - rule: Search destinations via API
    steps:
      - intent: search_destination
      - action: action_get_destination_info

  - rule: Get recommendations via API
    steps:
      - intent: ask_recommendation
      - action: action_get_recommendations

  - rule: Answer food tour review questions
    steps:
      - intent: ask_foodtour
      - action: action_rag_food_reviews

  # === Informational rules ===

  - rule: Answer hotel price question
    steps:
      - intent: ask_hotel_price
      - action: utter_ask_hotel_price

  - rule: Answer hotel amenities question
    steps:
      - intent: ask_hotel_amenities
      - action: utter_ask_hotel_amenities

  - rule: Handle hotel booking request
    steps:
      - intent: book_hotel
      - action: utter_book_hotel

  - rule: Handle flight booking request
    steps:
      - intent: book_flight
      - action: utter_book_flight

  - rule: Handle tour booking request
    steps:
      - intent: book_tour
      - action: utter_book_tour

  - rule: Answer location question
    steps:
      - intent: ask_location
      - action: utter_ask_location

  - rule: Answer weather question
    steps:
      - intent: ask_weather
      - action: utter_ask_weather

  - rule: Answer opening hours question
    steps:
      - intent: ask_opening_hours
      - action: utter_ask_opening_hours

  # === Fallback ===

  - rule: Ask for rephrase on low NLU confidence
    steps:
      - intent: nlu_fallback
      - action: utter_ask_rephrase
