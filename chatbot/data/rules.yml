version: "3.1"

rules:
  # Luôn chào lại khi người dùng chào
  - rule: Say hello when user greets
    steps:
      - intent: greet
      - action: utter_greet

  # Luôn tạm biệt khi người dùng nói goodbye
  - rule: Say goodbye when user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  # Trả lời khi được hỏi là bot
  - rule: Answer bot challenge
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  # Cảm ơn người dùng
  - rule: Thank the user
    steps:
      - intent: thank_you
      - action: utter_thank_you

  # Giúp đỡ người dùng
  - rule: Help user
    steps:
      - intent: help
      - action: utter_help

  # Respond to hotel search
  - rule: Respond to hotel search
    steps:
      - intent: search_hotel
      - action: utter_search_hotel

  # Respond to tour search
  - rule: Respond to tour search
    steps:
      - intent: search_tour
      - action: utter_search_tour

  # Respond to destination search
  - rule: Respond to destination search
    steps:
      - intent: search_destination
      - action: utter_search_destination

  # Respond to recommendation request
  - rule: Respond to recommendation request
    steps:
      - intent: ask_recommendation
      - action: utter_recommendation

  # Fallback when low confidence
  - rule: Ask for rephrase on low NLU confidence
    steps:
      - intent: nlu_fallback
      - action: utter_ask_rephrase
