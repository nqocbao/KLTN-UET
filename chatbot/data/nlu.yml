  # Chào hỏi
  - intent: greet
    examples: |
      - xin chào
      - chào bạn
      - hello
      - hi
      - chào
      - hế nhô
      - chào buổi sáng
      - chào buổi chiều
      - chào buổi tối
      - alo
      - hey

  # Tạm biệt
  - intent: goodbye
