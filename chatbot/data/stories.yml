version: "3.1"

stories:
  # Story 1: Greeting rồi hỏi thời tiết
  - story: Greet then ask weather
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_weather
      - action: utter_ask_weather

  # Story 2: Xin gợi ý điểm đến
  - story: Ask destination info then thank
    steps:
      - intent: search_destination
      - action: action_get_destination_info
      - intent: thank_you
      - action: utter_thank_you

  # Story 3: Gợi ý rồi tìm tour (form)
  - story: Ask recommendations then search tour form
    steps:
      - intent: ask_recommendation
      - action: action_get_recommendations
      - intent: search_tour
      - action: tour_form
      - active_loop: tour_form
      - slot_was_set:
          - requested_slot: destination
      - intent: provide_location
        entities:
          - destination: "Phú Quốc"
      - action: tour_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_tours
      - intent: thank_you
      - action: utter_thank_you

  # Story 4: Hỏi chi tiết khách sạn sau khi tìm (form)
  - story: Hotel form then ask details
    steps:
      - intent: search_hotel
      - action: hotel_form
      - active_loop: hotel_form
      - slot_was_set:
          - requested_slot: location
      - intent: provide_location
        entities:
          - location: "Hà Nội"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: check_in_date
      - intent: provide_location
        entities:
          - check_in_date: "2026-04-20"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: check_out_date
      - intent: provide_location
        entities:
          - check_out_date: "2026-04-22"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: number_of_guests
      - intent: provide_location
        entities:
          - number_of_guests: "2"
      - action: hotel_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_hotels
      - intent: ask_hotel_price
      - action: utter_ask_hotel_price
      - intent: ask_hotel_amenities
      - action: utter_ask_hotel_amenities
      - intent: book_hotel
      - action: utter_book_hotel

  # Story 5: Hỏi trợ giúp rồi tìm khách sạn (form)
  - story: Help then hotel form
    steps:
      - intent: help
      - action: utter_help
      - intent: search_hotel
      - action: hotel_form
      - active_loop: hotel_form
      - slot_was_set:
          - requested_slot: location
      - intent: provide_location
        entities:
          - location: "Đà Nẵng"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: check_in_date
      - intent: provide_location
        entities:
          - check_in_date: "2026-04-20"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: check_out_date
      - intent: provide_location
        entities:
          - check_out_date: "2026-04-23"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: number_of_guests
      - intent: provide_location
        entities:
          - number_of_guests: "2"
      - action: hotel_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_hotels
      - intent: thank_you
      - action: utter_thank_you

  # Story 6: Hỏi trợ giúp rồi tìm tour (form)
  - story: Help then tour form
    steps:
      - intent: help
      - action: utter_help
      - intent: search_tour
      - action: tour_form
      - active_loop: tour_form
      - slot_was_set:
          - requested_slot: destination
      - intent: provide_location
        entities:
          - destination: "Sapa"
      - action: tour_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_tours

  # Story 7: Phủ nhận trong form khách sạn và kết thúc
  - story: Deny in hotel form and goodbye
    steps:
      - intent: search_hotel
      - action: hotel_form
      - active_loop: hotel_form
      - intent: deny
      - active_loop: null
      - action: utter_deny
      - intent: goodbye
      - action: utter_goodbye

  # === Form-based stories (multi-turn context) ===

  # Story 16: Tìm vé - bot hỏi lần lượt từng thông tin
  - story: Flight form - bot asks step by step
    steps:
      - intent: search_flight
      - action: flight_form
      - active_loop: flight_form
      - slot_was_set:
          - requested_slot: flight_from
      - intent: provide_location
        entities:
          - location: "Hà Nội"
      - action: flight_form
      - slot_was_set:
          - flight_from: "Hà Nội"
          - requested_slot: flight_to
      - intent: provide_location
        entities:
          - location: "Đà Nẵng"
      - action: flight_form
      - slot_was_set:
          - flight_to: "Đà Nẵng"
          - requested_slot: flight_date
      - intent: provide_location
        entities:
          - flight_date: "2026-04-20"
      - action: flight_form
      - active_loop: null
      - slot_was_set:
          - flight_to: "Đà Nẵng"
          - flight_date: "2026-04-20"
          - requested_slot: null
      - action: action_search_flights

  # Story 17: Tìm vé - đã có đủ thông tin ngay từ đầu
  - story: Flight form - info provided upfront
    steps:
      - intent: search_flight
        entities:
          - flight_from: "Hà Nội"
          - flight_to: "Đà Nẵng"
          - flight_date: "2026-04-20"
      - action: flight_form
      - active_loop: null
      - action: action_search_flights

  # Story 18: Tìm khách sạn - bot hỏi địa điểm
  - story: Hotel form - bot asks for location
    steps:
      - intent: search_hotel
      - action: hotel_form
      - active_loop: hotel_form
      - slot_was_set:
          - requested_slot: location
      - intent: provide_location
        entities:
          - location: "Hà Nội"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: check_in_date
      - intent: provide_location
        entities:
          - check_in_date: "2026-04-20"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: check_out_date
      - intent: provide_location
        entities:
          - check_out_date: "2026-04-22"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: number_of_guests
      - intent: provide_location
        entities:
          - number_of_guests: "2"
      - action: hotel_form
      - active_loop: null
      - slot_was_set:
          - location: "Hà Nội"
          - requested_slot: null
      - action: action_search_hotels

  # Story 19: Tìm khách sạn - có địa điểm ngay từ đầu
  - story: Hotel form - location provided upfront
    steps:
      - intent: search_hotel
        entities:
          - location: "Đà Nẵng"
      - action: hotel_form
      - active_loop: hotel_form
      - slot_was_set:
          - requested_slot: check_in_date
      - intent: provide_location
        entities:
          - check_in_date: "2026-04-20"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: check_out_date
      - intent: provide_location
        entities:
          - check_out_date: "2026-04-22"
      - action: hotel_form
      - slot_was_set:
          - requested_slot: number_of_guests
      - intent: provide_location
        entities:
          - number_of_guests: "2"
      - action: hotel_form
      - active_loop: null
      - action: action_search_hotels

  # Story 20: Tìm tour - bot hỏi điểm đến
  - story: Tour form - bot asks for destination
    steps:
      - intent: search_tour
      - action: tour_form
      - active_loop: tour_form
      - slot_was_set:
          - requested_slot: destination
      - intent: provide_location
        entities:
          - destination: "Đà Lạt"
      - action: tour_form
      - active_loop: null
      - slot_was_set:
          - destination: "Đà Lạt"
          - requested_slot: null
      - action: action_search_tours

  # Story 21: Tìm tour - có điểm đến ngay từ đầu
  - story: Tour form - destination provided upfront
    steps:
      - intent: search_tour
        entities:
          - destination: "Sapa"
      - action: tour_form
      - active_loop: null
      - action: action_search_tours

  # Story 22: Hỏi trợ giúp rồi tìm vé
  - story: Help then flight form
    steps:
      - intent: help
      - action: utter_help
      - intent: search_flight
      - action: flight_form
      - active_loop: flight_form
      - slot_was_set:
          - requested_slot: flight_from
      - intent: provide_location
        entities:
          - location: "Hà Nội"
      - action: flight_form
      - slot_was_set:
          - requested_slot: flight_to
      - intent: provide_location
        entities:
          - location: "Phú Quốc"
      - action: flight_form
      - active_loop: null
      - action: action_search_flights

  # Story 23: Luồng đầy đủ với form - greet → tour → goodbye
  - story: Full flow with tour form
    steps:
      - intent: greet
      - action: utter_greet
      - intent: search_tour
      - action: tour_form
      - active_loop: tour_form
      - slot_was_set:
          - requested_slot: destination
      - intent: provide_location
        entities:
          - destination: "Phú Quốc"
      - action: tour_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_tours
      - intent: book_tour
      - action: utter_book_tour
      - intent: goodbye
      - action: utter_goodbye

  # Story 24: Food review với clarification follow-up
  # Dạy policy biết: sau action_rag_food_reviews, nếu user làm rõ thì vẫn route về food
  - story: Food review with location clarification
    steps:
      - intent: ask_foodtour
      - action: action_rag_food_reviews
      - intent: ask_foodtour
      - action: action_rag_food_reviews

  # Story 25: Food review nhiều turn liên tiếp
  - story: Food review multi-turn
    steps:
      - intent: ask_foodtour
      - action: action_rag_food_reviews
      - intent: ask_foodtour
      - action: action_rag_food_reviews
      - intent: ask_foodtour
      - action: action_rag_food_reviews
      - intent: thank_you
      - action: utter_thank_you
