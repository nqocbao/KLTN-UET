version: "3.1"

# Intents - Ý định người dùng
intents:
  - greet
  - goodbye
  - affirm
  - deny
  - thank_you
  - search_hotel
  - search_flight
  - search_tour
  - search_destination
  - book_hotel
  - book_flight
  - book_tour
  - ask_hotel_price
  - ask_hotel_amenities
  - ask_location
  - ask_recommendation
  - ask_weather
  - ask_opening_hours
  - help
  - bot_challenge
  - provide_location

# Entities - Thực thể cần trích xuất
entities:
  - hotel_name
  - location
  - destination
  - check_in_date
  - check_out_date
  - number_of_guests
  - room_type
  - price_range
  - amenity
  - flight_from
  - flight_to
  - flight_date
  - tour_type
  - duration

# Slots - Lưu trữ thông tin trong conversation
slots:
  hotel_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: hotel_name
  
  location:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: location
      - type: from_text
        conditions:
          - active_loop: hotel_form
            requested_slot: location
  
  destination:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: destination
      - type: from_entity
        entity: location
        conditions:
          - active_loop: tour_form
            requested_slot: destination
      - type: from_text
        conditions:
          - active_loop: tour_form
            requested_slot: destination
  
  check_in_date:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: check_in_date
  
  check_out_date:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: check_out_date
  
  number_of_guests:
    type: float
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: number_of_guests
  
  room_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: room_type
  
  price_range:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: price_range
  
  flight_from:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: flight_from
      - type: from_entity
        entity: location
        conditions:
          - active_loop: flight_form
            requested_slot: flight_from
      - type: from_text
        conditions:
          - active_loop: flight_form
            requested_slot: flight_from

  flight_to:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: flight_to
      - type: from_entity
        entity: location
        conditions:
          - active_loop: flight_form
            requested_slot: flight_to
      - type: from_text
        conditions:
          - active_loop: flight_form
            requested_slot: flight_to

  flight_date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: flight_date

  tour_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: tour_type

  duration:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: duration

  conversation_id:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

# Forms - Multi-turn slot filling
forms:
  flight_form:
    required_slots:
      - flight_from
      - flight_to

  hotel_form:
    required_slots:
      - location

  tour_form:
    required_slots:
      - destination

# Responses - Câu trả lời của bot
responses:
  utter_greet:
    - text: "Xin chào! Tôi là trợ lý du lịch của KLTN Travel. Tôi có thể giúp gì cho bạn?"
    - text: "Chào bạn! Rất vui được hỗ trợ bạn tìm kiếm thông tin du lịch hôm nay."
  
  utter_goodbye:
    - text: "Tạm biệt! Chúc bạn có chuyến đi vui vẻ!"
    - text: "Hẹn gặp lại! Đừng ngần ngại liên hệ nếu bạn cần thêm thông tin."
  
  utter_thank_you:
    - text: "Rất vui được giúp đỡ bạn! 😊"
    - text: "Không có gì! Hãy cho tôi biết nếu bạn cần gì thêm."
  
  utter_iamabot:
    - text: "Tôi là chatbot được phát triển để hỗ trợ bạn tìm kiếm và đặt dịch vụ du lịch."
  
  utter_help:
    - text: |
        Tôi có thể giúp bạn:
        🏨 Tìm kiếm và đặt khách sạn
        ✈️ Tìm kiếm chuyến bay
        🗺️ Tư vấn điểm đến du lịch
        🎫 Đặt tour du lịch
        
        Bạn cần tôi giúp gì?
  
  utter_ask_rephrase:
    - text: "Xin lỗi, tôi không hiểu ý bạn. Bạn có thể nói rõ hơn được không?"
    - text: "Tôi chưa hiểu câu hỏi của bạn. Bạn có thể diễn đạt lại không?"
  
  utter_default:
    - text: "Xin lỗi, tôi chưa được huấn luyện để trả lời câu hỏi này. Vui lòng liên hệ bộ phận hỗ trợ khách hàng."

  utter_search_hotel:
    - text: "Bạn muốn tìm khách sạn ở đâu? Hãy cho tôi biết địa điểm, ngày nhận phòng và số lượng khách nhé!"
    - text: "Tôi có thể giúp bạn tìm khách sạn. Bạn muốn đặt phòng ở thành phố nào?"

  utter_search_destination:
    - text: "Chúng tôi có nhiều điểm đến hấp dẫn! Bạn thích du lịch biển, núi hay thành phố?"
    - text: "Tôi có thể gợi ý một số điểm đến phổ biến: Hà Nội, Đà Nẵng, Nha Trang, Phú Quốc, Sapa... Bạn quan tâm đến đâu?"

  utter_search_tour:
    - text: "Bạn muốn tìm tour du lịch đi đâu? Tôi có thể tìm các tour trong nước và nước ngoài cho bạn."
    - text: "Chúng tôi có nhiều loại tour: tour biển, tour núi, tour văn hóa... Bạn thích loại nào?"

  utter_recommendation:
    - text: "Dựa trên sở thích của bạn, tôi gợi ý: Đà Nẵng (biển đẹp), Sapa (núi non hùng vĩ), Hà Nội (văn hóa lịch sử). Bạn muốn biết thêm về điểm đến nào?"
    - text: "Tôi có thể gợi ý điểm đến phù hợp. Bạn muốn đi du lịch trong bao lâu? Ngân sách của bạn là bao nhiêu?"

  utter_search_flight:
    - text: "Bạn muốn bay từ đâu đến đâu? Hãy cho tôi biết điểm đi, điểm đến và ngày bay nhé!"
    - text: "Tôi có thể giúp bạn tìm vé máy bay. Bạn muốn bay từ thành phố nào?"

  utter_ask_hotel_price:
    - text: "Giá phòng khách sạn thường từ 500K - 5 triệu/đêm tùy hạng sao và vị trí. Bạn muốn tôi tìm khách sạn trong khoảng giá nào?"
    - text: "Giá khách sạn phụ thuộc vào vị trí, hạng sao và loại phòng. Cho tôi biết ngân sách của bạn, tôi sẽ tìm phòng phù hợp!"

  utter_ask_hotel_amenities:
    - text: "Các khách sạn thường có tiện nghi: WiFi, bể bơi, gym, nhà hàng, spa, chỗ đậu xe... Bạn cần tiện nghi gì đặc biệt?"
    - text: "Tiện nghi phổ biến gồm: WiFi miễn phí, điều hòa, minibar, phòng tắm riêng, bữa sáng. Bạn muốn tìm khách sạn có tiện nghi cụ thể nào?"

  utter_book_hotel:
    - text: "Hiện tại bạn có thể liên hệ tư vấn đặt phòng qua hotline 1900 1234, Zalo 0123 456 789 hoặc nhấn nút 'Liên hệ đặt phòng' trên trang khách sạn. Đội ngũ tư vấn sẽ hỗ trợ bạn nhanh nhất!"
    - text: "Để đặt phòng khách sạn, bạn hãy liên hệ đội ngũ tư vấn qua hotline 1900 1234 hoặc Zalo 0123 456 789 nhé! Bạn cũng có thể lưu khách sạn yêu thích để xem lại sau."

  utter_book_flight:
    - text: "Để đặt vé máy bay, bạn hãy liên hệ đội ngũ tư vấn qua hotline 1900 1234 hoặc Zalo 0123 456 789. Nhấn nút 'Liên hệ' trên trang chuyến bay để được hỗ trợ nhanh nhất!"
    - text: "Bạn có thể liên hệ tư vấn đặt vé qua hotline 1900 1234, Zalo 0123 456 789 hoặc email support@vivutravel.vn. Tôi có thể giúp bạn tìm chuyến bay phù hợp trước nhé!"

  utter_book_tour:
    - text: "Để đặt tour, bạn hãy liên hệ đội ngũ tư vấn qua hotline 1900 1234 hoặc Zalo 0123 456 789. Ngoài ra bạn có thể nhấn nút 'Liên hệ tư vấn' trên trang tour để được hỗ trợ!"
    - text: "Bạn có thể liên hệ tư vấn đăng ký tour qua hotline 1900 1234, Zalo 0123 456 789 hoặc email support@vivutravel.vn. Tôi có thể giúp bạn tìm tour phù hợp trước nhé!"

  utter_ask_location:
    - text: "Bạn muốn tìm ở thành phố nào? (ví dụ: Hà Nội, Đà Nẵng, Nha Trang, Hồ Chí Minh)"
    - text: "Hãy cho tôi biết địa điểm bạn muốn tìm kiếm!"

  utter_ask_weather:
    - text: "Thời tiết Việt Nam thay đổi theo vùng miền. Bạn muốn biết thời tiết ở đâu? Tôi sẽ gợi ý thời điểm du lịch tốt nhất."
    - text: "Miền Bắc có 4 mùa, miền Trung nắng nóng, miền Nam 2 mùa mưa nắng. Bạn định đi đâu? Tôi sẽ tư vấn thời điểm phù hợp."

  utter_ask_opening_hours:
    - text: "Giờ mở cửa các điểm tham quan thường từ 8:00 - 17:00. Bạn muốn biết giờ mở cửa ở đâu?"
    - text: "Mỗi điểm tham quan có giờ mở cửa khác nhau. Cho tôi biết địa điểm cụ thể, tôi sẽ tra cứu giúp bạn."

  utter_affirm:
    - text: "Tuyệt vời! Tôi có thể giúp gì thêm cho bạn?"
    - text: "Được rồi! Bạn cần gì nữa không?"

  utter_deny:
    - text: "Không sao! Bạn cứ hỏi tôi bất cứ khi nào cần nhé."
    - text: "Ok! Nếu cần gì, cứ nhắn cho tôi."

  utter_ask_flight_from:
    - text: "Bạn muốn bay từ thành phố nào? (ví dụ: Hà Nội, Đà Nẵng, TP.HCM)"

  utter_ask_flight_to:
    - text: "Bạn muốn bay đến đâu? (ví dụ: Đà Nẵng, Phú Quốc, Singapore, Hà Nội)"

  utter_ask_destination:
    - text: "Bạn muốn đi tour đến đâu? (ví dụ: Đà Lạt, Sapa, Phú Quốc, Nhật Bản)"

# Actions - Các hành động custom
actions:
  - action_search_hotels
  - action_search_flights
  - action_search_tours
  - action_get_hotel_details
  - action_get_destination_info
  - action_save_conversation
  - action_get_recommendations
  - action_get_full_itinerary
  - validate_flight_form
  - validate_hotel_form
  - validate_tour_form

# Session configuration
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
