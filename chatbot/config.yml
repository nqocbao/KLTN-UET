# ===================================
# RASA Configuration - Vietnamese NLP
# ===================================
# Chatbot: KLTN Travel Assistant
# Language: Vietnamese (Tiếng Việt)
# Framework: RASA 3.6+
# Updated: 2026-02-02
# ===================================

language: vi

# ===================================
# NLU PIPELINE - Optimized for Vietnamese
# ===================================
pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 3
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 2
    max_ngram: 4
  - name: DIETClassifier
    epochs: 100
    entity_recognition: False
    constrain_similarities: true
  - name: FallbackClassifier
    threshold: 0.3

# ===================================
# DIALOGUE POLICIES
# ===================================
policies:
  - name: MemoizationPolicy
  - name: RulePolicy
  - name: TEDPolicy
    max_history: 5
    epochs: 100

# ===================================
# ASSISTANT METADATA
# ===================================
assistant_id: kltn_travel_assistant_v2
